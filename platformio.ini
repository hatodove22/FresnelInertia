[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_ldf_mode = deep+
build_src_filter =
  +<*>
  -<audio_smoke_main.cpp>
  -<display_probe_main.cpp>
  -<main_audio_probe.cpp>
  -<main_boot_probe.cpp>
  -<main_delta_probe.cpp>
  -<main_loop_probe.cpp>
  -<main_pipeline_probe.cpp>
  -<transducer_probe_main.cpp>
  -<raw_i2s_probe_main.cpp>
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DHAPTICS_ENABLE_AUDIO_BACKEND=0
  -DHAPTICS_ENABLE_REMOTE_BACKEND=0
  -DHAPTICS_ENABLE_TILT_SERVO=0
  -std=gnu++17
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified
  bblanchon/ArduinoJson@^6.21.5

[env:m5stack-sticks3-audio]
extends = env:m5stack-sticks3
build_unflags =
  -DHAPTICS_ENABLE_AUDIO_BACKEND=0
  -DHAPTICS_ENABLE_REMOTE_BACKEND=0
build_flags =
  ${env:m5stack-sticks3.build_flags}
  -DHAPTICS_ENABLE_AUDIO_BACKEND=1
  -DHAPTICS_ENABLE_REMOTE_BACKEND=1
  -DHAPTICS_SINGLE_AMP_BENCH_DEFAULTS=1
  -DHAPTICS_MAIN_MONITORING_DEFAULTS=1

[env:m5stack-sticks3-audio-storageless]
extends = env:m5stack-sticks3-audio
build_flags =
  ${env:m5stack-sticks3-audio.build_flags}
  -DHAPTICS_DEBUG_DISABLE_STORAGE=1

[env:m5stack-sticks3-audio-direct-display]
extends = env:m5stack-sticks3-audio-storageless
build_flags =
  ${env:m5stack-sticks3-audio-storageless.build_flags}
  -DHAPTICS_DEBUG_DIRECT_TEXT_DISPLAY=1

[env:m5stack-sticks3-audio-smoke]
extends = env:m5stack-sticks3-audio
build_src_filter =
  -<*>
  +<audio_smoke_main.cpp>

[env:m5stack-sticks3-display-probe]
